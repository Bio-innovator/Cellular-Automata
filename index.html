<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cellular Automata</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <div id="setupModal" class="modal visible" role="dialog" aria-modal="true">
        <div class="modal-card">
          <h2>启动设置</h2>
          <div class="setup-actions">
            <button id="openWorldBtn" class="primary-btn" type="button">世界生成</button>
            <button id="openBlockBtn" class="secondary-btn" type="button">方块设定</button>
          </div>
        </div>
      </div>

      <div id="worldModal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-card narrow">
          <h3>世界生成</h3>

          <div class="field-row">
            <label for="rowsInput">世界高度</label>
            <input id="rowsInput" type="number" min="8" max="40" value="18" />
          </div>

          <div class="field-row">
            <label for="colsInput">世界宽度</label>
            <input id="colsInput" type="number" min="8" max="60" value="26" />
          </div>

          <div class="field-row">
            <label for="densityInput">初始密度</label>
            <input id="densityInput" type="range" min="10" max="45" value="22" />
            <span id="densityValue">22%</span>
          </div>

          <div class="modal-actions">
            <button id="generateWorldBtn" class="primary-btn" type="button">生成</button>
            <button id="cancelWorldBtn" class="secondary-btn" type="button">取消</button>
          </div>
        </div>
      </div>

      <div id="blockModal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-card narrow">
          <h3>方块设定</h3>
          <div class="block-config-list" id="blockConfigList"></div>
          <div class="modal-actions">
            <button id="saveBlocksBtn" class="primary-btn" type="button">保存</button>
            <button id="cancelBlockBtn" class="secondary-btn" type="button">取消</button>
          </div>
        </div>
      </div>

      <section id="simulationSection" class="simulation-section hidden">
        <div class="toolbar">
          <div class="toolbar-left">
            <label class="slider-wrap" for="speedSlider">
              <span>速度</span>
              <input id="speedSlider" type="range" min="10" max="100" value="55" />
            </label>
          </div>

          <div class="toolbar-right">
            <button id="pauseBtn" type="button" class="small-btn">暂停</button>
            <button id="resetBtn" type="button" class="small-btn">重置</button>
            <button id="newWorldBtn" type="button" class="small-btn">新建世界</button>
            <button id="blockSettingsBtn" type="button" class="small-btn">方块设定</button>
          </div>
        </div>

        <div class="grid-shell">
          <div id="grid" class="cell-grid" aria-label="Cellular automata grid"></div>
        </div>
      </section>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
